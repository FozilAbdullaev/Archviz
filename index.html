<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Спальня — прогулка</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  #ui { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column;
        color: #eee; background: rgba(10, 10, 10, .72); text-align: center; gap: 14px; z-index: 2; }
  #ui.hidden { display: none; }
  #ui h1 { font-weight: 500; font-size: 26px; margin: 0; }
  #ui p { margin: 0; color: #bbb; font-size: 15px; line-height: 1.5; }
  #bar { width: 260px; height: 4px; background: #333; border-radius: 2px; overflow: hidden; }
  #bar i { display: block; height: 100%; width: 0; background: #d9b48f; transition: width .2s; }
  #go { padding: 12px 28px; font-size: 16px; border: 0; border-radius: 6px; background: #d9b48f; color: #222;
        cursor: pointer; display: none; }
  #VRButton { z-index: 3; }
  #cast { font-size: 14px; color: #d9b48f; user-select: text; }
  #badge { position: fixed; left: 12px; top: 10px; z-index: 3; color: #eee; font-size: 13px; background: rgba(0, 0, 0, .45);
           padding: 4px 10px; border-radius: 4px; display: none; pointer-events: none; }
</style>
</head>
<body>
<div id="ui">
  <h1>Спальня</h1>
  <div id="bar"><i></i></div>
  <p id="status">Загрузка…</p>
  <button id="go">Войти</button>
  <p id="cast"></p>
  <p id="help">Мышь — осмотреться · WASD / стрелки — идти · Shift — быстрее · Esc — пауза<br>
     В очках: кнопка «ENTER VR» внизу · левый стик — шаг · правый стик вперёд — телепорт, вбок — поворот · удерживать B или Y — выйти из VR</p>
</div>
<div id="badge"></div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
  "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.8.3/build/index.module.js"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
import { VRButton } from 'three/addons/webxr/VRButton.js';
import { Reflector } from 'three/addons/objects/Reflector.js';
import { computeBoundsTree, disposeBoundsTree, acceleratedRaycast } from 'three-mesh-bvh';

THREE.BufferGeometry.prototype.computeBoundsTree = computeBoundsTree;
THREE.BufferGeometry.prototype.disposeBoundsTree = disposeBoundsTree;
THREE.Mesh.prototype.raycast = acceleratedRaycast;

const CFG = await (await fetch('scene.json')).json();   // written by the export script
const EYE = 1.6, RADIUS = 0.25;

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;   // AgX read flat and pastel next to the renders
renderer.toneMappingExposure = CFG.exposure;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.xr.enabled = true;
renderer.xr.setFoveation(0.5);
document.body.appendChild(renderer.domElement);
const MAX_ANISO = Math.min(16, renderer.capabilities.getMaxAnisotropy());

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111111);
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.05, 100);
const rig = new THREE.Group();               // moves the player (desktop camera + VR headset)
rig.add(camera);
scene.add(rig);

const bar = document.querySelector('#bar i'), status = document.getElementById('status');
const manager = new THREE.LoadingManager();
manager.onProgress = (url, done, total) => { bar.style.width = (100 * done / total) + '%'; };

// reflections: Cycles panorama from the middle of the room, used for specular only (light comes from lightmaps)
const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = await new RGBELoader(manager).loadAsync(CFG.env);
envTex.mapping = THREE.EquirectangularReflectionMapping;
const envMap = pmrem.fromEquirectangular(envTex).texture;
envTex.dispose();
if (CFG.sky) {                       // sky behind the windows (same HDRI and rotation as the bake)
  const sky = await new RGBELoader(manager).loadAsync(CFG.sky);
  sky.mapping = THREE.EquirectangularReflectionMapping;
  scene.background = sky;
  scene.backgroundRotation.set(0, THREE.MathUtils.degToRad(CFG.skyRotation || 0), 0);
  scene.backgroundIntensity = CFG.skyIntensity ?? 1;
}

const tl = new THREE.TextureLoader(manager);
// 8192 lightmaps are ~1 GB of GPU memory with mips: full size on desktop, halved on the Quest / phones
// (or where the GPU cannot hold them); ?lm=full or ?lm=half overrides
const LM_Q = new URLSearchParams(location.search).get('lm');
const LM_HALF = LM_Q ? LM_Q === 'half'
  : /OculusBrowser|Quest|Android|iPhone|iPad/i.test(navigator.userAgent) || renderer.capabilities.maxTextureSize < 8192;
async function loadLightmap(f) {
  if (!LM_HALF) return tl.loadAsync(f);
  manager.itemStart(f);
  const blob = await (await fetch(f)).blob();
  // atlases are square; a 4096 atlas passes through unchanged
  const bmp = await createImageBitmap(blob, { resizeWidth: 4096, resizeHeight: 4096, resizeQuality: 'high',
                                              colorSpaceConversion: 'none', premultiplyAlpha: 'none' });
  manager.itemEnd(f);
  const t = new THREE.Texture(bmp); t.needsUpdate = true;
  return t;
}
const lightmaps = await Promise.all(CFG.lightmaps.map(async f => {
  const t = await loadLightmap(f);
  t.flipY = false; t.channel = 1; t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}));

const draco = new DRACOLoader().setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/libs/draco/gltf/');
const gltf = await new GLTFLoader(manager).setDRACOLoader(draco).loadAsync(CFG.model);
const colliders = [];
// lightmap texels carry an extra gamma 2.2 (more precision in the dark), the env map gives reflections only;
// faces too thin to own a lightmap texel carry their light in COLOR_0 (same encoding, rgb = 0 elsewhere)
// bicubic B-spline lightmap lookup (4 bilinear taps): bilinear shows the texel grid as stair-stepped shadow edges
const LM_BICUBIC = `
vec4 lmBicubic( sampler2D tex, vec2 uv ) {
  vec2 ts = vec2( textureSize( tex, 0 ) ), dx = dFdx( uv ), dy = dFdy( uv );
  vec2 st = uv * ts - 0.5, i = floor( st ), f = st - i, f2 = f * f, f3 = f2 * f;
  vec2 w0 = ( 1.0 - 3.0 * f + 3.0 * f2 - f3 ) / 6.0, w1 = ( 4.0 - 6.0 * f2 + 3.0 * f3 ) / 6.0;
  vec2 w2 = ( 1.0 + 3.0 * f + 3.0 * f2 - 3.0 * f3 ) / 6.0, w3 = f3 / 6.0;
  vec2 g0 = w0 + w1, g1 = w2 + w3;
  vec2 h0 = ( i - 0.5 + w1 / g0 ) / ts, h1 = ( i + 1.5 + w3 / g1 ) / ts;
  return g0.y * ( g0.x * textureGrad( tex, h0, dx, dy ) + g1.x * textureGrad( tex, vec2( h1.x, h0.y ), dx, dy ) )
       + g1.y * ( g0.x * textureGrad( tex, vec2( h0.x, h1.y ), dx, dy ) + g1.x * textureGrad( tex, h1, dx, dy ) );
}
`;
const LM_CHUNK = THREE.ShaderChunk.lights_fragment_maps
  .replace('texture2D( lightMap, vLightMapUv )', 'lmBicubic( lightMap, vLightMapUv )')
  .replace('lightMapTexel.rgb * lightMapIntensity',
           'lmSat( pow( vLmv.r + vLmv.g + vLmv.b > 0.0 ? vLmv : lightMapTexel.rgb, vec3( 2.2 ) ) ) * lightMapIntensity')
  .replace('iblIrradiance += getIBLIrradiance( geometryNormal );', '');
// box-projected reflections: env.hdr was rendered from one point, so a plain env map reflects the room at infinity
// (wrong place on mirrors, glass, metal, floor); intersecting the reflected ray with the room box fixes the parallax
const EB = CFG.envBox || [[0.508, 0.0, -7.675], [6.158, 3.65, -0.625]];
const EP = CFG.envPos || [3.333, 1.3, -4.15];
const v3 = a => `vec3( ${a.map(x => x.toFixed(4)).join(', ')} )`;
const BOX_FN = `
varying vec3 vBoxPos;
vec3 boxProject( vec3 v ) {
  vec3 rmax = ( ${v3(EB[1])} - vBoxPos ) / v, rmin = ( ${v3(EB[0])} - vBoxPos ) / v;
  vec3 r = max( rmax, rmin ); float t = min( min( r.x, r.y ), r.z );
  return t > 0.0 ? vBoxPos + v * t - ${v3(EP)} : v;
}
`;
const ENV_CHUNK = BOX_FN + THREE.ShaderChunk.envmap_physical_pars_fragment
  .replace('reflectVec = inverseTransformDirection( reflectVec, viewMatrix );',
           'reflectVec = normalize( boxProject( inverseTransformDirection( reflectVec, viewMatrix ) ) );');
// bed fabrics: the model's own velvet map at a reduced contrast (at full strength its stain pattern read as giraffe
// spots) times a fine weave from the velvet bump map; diffuse light is baked, so the weave has to be in the albedo
const weave = await tl.loadAsync('tex/velvet_weave.jpg');
weave.wrapS = weave.wrapT = THREE.RepeatWrapping; weave.colorSpace = THREE.NoColorSpace; weave.anisotropy = MAX_ANISO;
function imgAvg(img, srgb) {
  const c = new OffscreenCanvas(32, 32), g = c.getContext('2d'); g.drawImage(img, 0, 0, 32, 32);
  const d = g.getImageData(0, 0, 32, 32).data, s = [0, 0, 0];
  for (let i = 0; i < d.length; i += 4) for (let j = 0; j < 3; j++) {
    const v = d[i + j] / 255; s[j] += srgb ? (v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4)) : v;
  }
  return s.map(v => Math.max(v / (d.length / 4), 1e-3));
}
const WEAVE_AVG = imgAvg(weave.image, false)[0];
const FABRICS = [   // name, tint (the renders), map contrast, weave strength, weave repeat
  [/Vittoria_area_BARXT/, '#D6CCC1', 0.35, 0.45, 1.0],
  [/Zenit 128_Microvelor/, '#9E847A', 0.35, 0.45, 1.0],
  [/Zenit 9_Microvelor/, '#B29E8E', 0.35, 0.45, 1.0],
];
const DUVET_REP = 4.0;
const f3 = v => v.toFixed(4);
// colour matched against Renders/01 and 05 (door, wall, ceiling, floor, marble sampled in both)
const WB = { value: new THREE.Vector3(0.95, 1.0, 1.1) };    // linear camera white-balance gains
const LSAT = { value: 0.5 };                                 // saturation of the baked light (1 = as baked)
function patch(m, kind) {     // kind: 'baked' | 'glass' | 'plain'
  m.onBeforeCompile = shader => {
    const fab = m.userData.fab;
    if (m.userData.sat !== undefined)   // ACES pushes saturated albedos (oak, walnut, marble) further than the renders
      shader.fragmentShader = shader.fragmentShader.replace('#include <color_fragment>', `#include <color_fragment>
  diffuseColor.rgb = mix( vec3( dot( diffuseColor.rgb, vec3( 0.2126, 0.7152, 0.0722 ) ) ), diffuseColor.rgb, ${f3(m.userData.sat)} );`);
    if (fab) {
      shader.uniforms.weaveMap = { value: weave };
      shader.fragmentShader = shader.fragmentShader
        .replace('#include <common>', '#include <common>\nuniform sampler2D weaveMap;')
        .replace('#include <map_fragment>', `#ifdef USE_MAP
  vec3 fabTex = texture2D( map, vMapUv ).rgb / vec3( ${fab.avg.map(f3).join(', ')} );
  float fabW = texture2D( weaveMap, vMapUv * ${f3(fab.rep)} ).r / ${f3(WEAVE_AVG)};
  diffuseColor.rgb *= mix( vec3( 1.0 ), fabTex, ${f3(fab.k)} ) * mix( 1.0, fabW, ${f3(fab.w)} );
#endif`);
    }
    let vs = shader.vertexShader, fs = shader.fragmentShader;
    vs = vs.replace('#include <common>', '#include <common>\nvarying vec3 vBoxPos;')
           .replace('#include <worldpos_vertex>', '#include <worldpos_vertex>\nvBoxPos = ( modelMatrix * vec4( transformed, 1.0 ) ).xyz;');
    fs = fs.replace('#include <envmap_physical_pars_fragment>', ENV_CHUNK);
    // camera white balance: the bake (warm LEDs, warm bounce) came out far yellower than the Corona renders
    shader.uniforms.uWB = WB;
    fs = fs.replace('#include <common>', '#include <common>\nuniform vec3 uWB;')
           .replace('#include <tonemapping_fragment>', 'gl_FragColor.rgb *= uWB;\n#include <tonemapping_fragment>');
    if (kind === 'baked') {
      vs = vs.replace('#include <common>', '#include <common>\nattribute vec3 color;\nvarying vec3 vLmv;')
             .replace('#include <begin_vertex>', '#include <begin_vertex>\nvLmv = color;');
      // baked light colour pulled toward grey: warm LED light and blue sky light both read far more
      // coloured than in the Corona renders, where the light is close to neutral and the colour is in the materials
      shader.uniforms.uLSat = LSAT;
      fs = fs.replace('#include <common>', '#include <common>\nvarying vec3 vLmv;\nuniform float uLSat;\n' +
                      'vec3 lmSat( vec3 c ) { return mix( vec3( dot( c, vec3( 0.2126, 0.7152, 0.0722 ) ) ), c, uLSat ); }' + LM_BICUBIC)
             .replace('#include <lights_fragment_maps>', LM_CHUNK);
    }
    if (kind === 'glass')     // reflections at full strength, only the see-through part is blended by opacity
      fs = fs.replace('vec3 outgoingLight = totalDiffuse + totalSpecular + totalEmissiveRadiance;',
                      'vec3 outgoingLight = totalDiffuse * diffuseColor.a + totalSpecular + totalEmissiveRadiance;');
    shader.vertexShader = vs; shader.fragmentShader = fs;
  };
  m.customProgramCacheKey = () => 'p_' + kind + (m.userData.fab || m.userData.sat !== undefined ? '_' + m.name : '');
}
const mirrors = [];
const lmMats = new Map();     // glTF shares one material between the atlases: one copy per lightmap, or the last one wins
gltf.scene.traverse(o => {
  if (!o.isMesh) return;
  const lm = o.userData.lm ?? (o.parent && o.parent.userData.lm);
  let mats = Array.isArray(o.material) ? o.material : [o.material];
  if (lm !== undefined && lm >= 0 && o.geometry.attributes.uv1) {
    mats = mats.map(m => {
      const k = m.uuid + '_' + lm;
      if (!lmMats.has(k)) lmMats.set(k, m.clone());
      return lmMats.get(k);
    });
    o.material = Array.isArray(o.material) ? mats : mats[0];
  }
  for (const m of mats) {
    if (/^Wall_Mirror|^Mirror_Regal/.test(m.name)) mirrors.push(o);
    if (/^LED_Cove_LIGHT/.test(m.name)) o.visible = false;   // the strips sit hidden in pockets: only their light (baked) shows
    if (m.userData.done) continue;                           // tints multiply: once per material
    m.userData.done = true;
    m.envMap = envMap;
    m.envMapIntensity = CFG.reflections;
    const glass = /glass/i.test(m.name) && m.transparent;
    if (lm !== undefined && lm >= 0 && o.geometry.attributes.uv1) {
      m.lightMap = lightmaps[lm];
      m.lightMapIntensity = CFG.lightmapScale * Math.PI;
      m.vertexColors = false;                       // COLOR_0 is light, not albedo
      // walnut panels and the parquet: their textures are paler than the renders show
      // (ACES pushes these oranges: the renders show a neutral light oak and a mid-brown walnut)
      if (/_302$/.test(m.name)) { m.color.setRGB(0.30, 0.25, 0.21); m.userData.sat = 0.8; }
      if (/Toned Oak/.test(m.name)) { m.color.setRGB(0.92, 0.85, 0.78); m.userData.sat = 0.7; }
      // marble pillars: grey-blue with white veins in the renders, the texture reads mint green
      if (/-2147483273_1001/.test(m.name)) { m.color.setRGB(0.42, 0.47, 0.53); m.userData.sat = 0.15; }
      const fab = FABRICS.find(f => f[0].test(m.name));
      if (fab) {
        m.color.set(fab[1]);          // mean colour = the tint, the map only adds its (softened) texture
        if (m.map && m.map.image) m.userData.fab = { avg: imgAvg(m.map.image, true), k: fab[2], w: fab[3], rep: fab[4] };
      }
      // duvet: plain colour in the source (Corona had only a bump on it): the weave as its texture
      if (/Felis_Bed_LUIS_Material #101/.test(m.name) && !m.map && o.geometry.attributes.uv) {
        m.map = weave; m.userData.fab = { avg: [WEAVE_AVG, WEAVE_AVG, WEAVE_AVG], k: 0.0, w: 0.3, rep: DUVET_REP };
      }
      // boucle headboard: the glTF lost the texture's tiling, its loops came out as big pebbles
      if (/White Boucle/.test(m.name) && m.map) {
        m.map = m.map.clone(); m.map.wrapS = m.map.wrapT = THREE.RepeatWrapping; m.map.repeat.set(5, 5); m.map.needsUpdate = true;
      }
      // ficus leaves (now lit per vertex, both sides): the variegated texture reads yellow, the renders show deep green
      if (/ficus_banjamina$/.test(m.name)) { m.color.setRGB(0.45, 0.62, 0.35); m.userData.sat = 0.9; }
      patch(m, 'baked');
      // vanity mirror: black glossy glass (Max: IOR 2.09) over a clean mirror -> the smoked reflection of render 07
      if (/^Glass_Regal/.test(m.name)) { m.transparent = true; m.opacity = 0.55; m.depthWrite = false; m.roughness = 0.02; }
    } else if (glass) {
      m.roughness = Math.min(m.roughness, 0.04); m.metalness = 0;
      if (/smoked/i.test(m.name)) { m.opacity = 0.7; m.color.setRGB(0.06, 0.045, 0.034); }  // dark bronze, interior faint
      else m.opacity = Math.min(m.opacity, 0.12);
      m.blending = THREE.CustomBlending; m.blendSrc = THREE.OneFactor; m.blendDst = THREE.OneMinusSrcAlphaFactor;
      m.envMapIntensity = 1.3; m.depthWrite = false;
      patch(m, 'glass');
    } else if (/^Sheer_White/.test(m.name)) {
      // window voile (Max: thin, translucency 0.5): see-through white, glowing with the daylight behind it
      m.transparent = true; m.opacity = 0.5; m.depthWrite = false; m.side = THREE.DoubleSide;
      m.color.setRGB(0.9, 0.9, 0.88); m.emissive.setRGB(0.55, 0.55, 0.54); m.envMapIntensity = 0.3;
      patch(m, 'plain');
    } else {
      if (!m.transparent) m.emissiveMap = m.emissiveMap || m.map;     // unbaked opaque object: keep it visible
      // the ficus (no lightmap: too many islands) is lit by the env map only, at full strength it read pale yellow
      if (/ficus_banjamina$/.test(m.name)) { m.color.setRGB(0.45, 0.62, 0.35); m.envMapIntensity = 0.55; }
      if (/ficus_banjamina trunk|Graund/.test(m.name)) m.envMapIntensity = 0.55;
      patch(m, 'plain');
    }
    // full anisotropic filtering: the floor, rug and wall panels are seen at grazing angles and blurred at 4x
    for (const k of ['map', 'normalMap', 'roughnessMap', 'metalnessMap', 'bumpMap', 'aoMap', 'emissiveMap'])
      if (m[k]) m[k].anisotropy = MAX_ANISO;
  }
  o.matrixAutoUpdate = false; o.updateMatrix();
  if (lm !== undefined && lm >= 0) { o.geometry.computeBoundsTree(); colliders.push(o); }
});
scene.add(gltf.scene);
scene.updateMatrixWorld(true);

// the wall mirror: a real planar reflection on desktop; in the headset the box-projected env map (a mirror
// camera per eye is too heavy for the Quest and Reflector does not handle the stereo camera)
const reflectors = [];
for (const o of mirrors) {
  const bb = new THREE.Box3().setFromObject(o), size = bb.getSize(new THREE.Vector3()), c = bb.getCenter(new THREE.Vector3());
  const ax = size.x < size.y && size.x < size.z ? 'x' : size.z < size.y ? 'z' : 'y';
  // the Regal vanity mirror faces the dressing side (-x), away from the room centre; its plane goes just behind
  // the front of the smoked glass, so the glass and its bevels stay in front of the reflection
  const regal = /^Mirror_Regal/.test((Array.isArray(o.material) ? o.material[0] : o.material).name);
  const n = new THREE.Vector3(); n[ax] = regal ? -1 : Math.sign(EP[ax === 'x' ? 0 : ax === 'y' ? 1 : 2] - c[ax]) || 1;
  const w = ax === 'x' ? size.z : size.x, h = ax === 'y' ? size.z : size.y;
  const r = new Reflector(new THREE.PlaneGeometry(w, h), {
    textureWidth: Math.min(2048, innerWidth * devicePixelRatio), textureHeight: Math.min(2048, innerHeight * devicePixelRatio),
    color: 0x7d807d });
  if (regal) r.position.copy(c).setX(bb.max.x - 0.0045);
  else r.position.copy(c).addScaledVector(n, size[ax] / 2 + 0.003);
  r.lookAt(r.position.clone().add(n));
  scene.add(r); reflectors.push(r);
  o.visible = false;
}
const mirrorMode = xr => { for (const r of reflectors) r.visible = !xr; for (const o of mirrors) o.visible = xr; };
window.__dbg = { THREE, scene, camera, rig, renderer, WB, LSAT };

// start position (glTF is Y-up: three x = blender x, three z = -blender y)
rig.position.set(CFG.spawn[0], 0, -CFG.spawn[1]);
rig.rotation.y = THREE.MathUtils.degToRad(CFG.spawnYaw || 0);
camera.position.set(0, EYE, 0);

// ---------- movement & collision ----------
const ray = new THREE.Raycaster(); ray.firstHitOnly = true;
function blocked(from, dir, dist) {
  for (const h of [0.45, 1.1]) {
    ray.set(new THREE.Vector3(from.x, h, from.z), dir); ray.far = dist + RADIUS;
    if (ray.intersectObjects(colliders, false).length) return true;
  }
  return false;
}
function tryMove(delta) {                    // slide along walls: x and z separately
  const p = new THREE.Vector3(); camera.getWorldPosition(p);
  for (const axis of ['x', 'z']) {
    const d = new THREE.Vector3(); d[axis] = delta[axis];
    const len = Math.abs(d[axis]); if (len < 1e-6) continue;
    if (!blocked(p, d.clone().normalize(), len)) { rig.position[axis] += d[axis]; p[axis] += d[axis]; }
  }
}

// desktop
const controls = new PointerLockControls(camera, document.body);
const ui = document.getElementById('ui'), go = document.getElementById('go');
go.onclick = () => controls.lock();
controls.addEventListener('lock', () => ui.classList.add('hidden'));
controls.addEventListener('unlock', () => { if (!renderer.xr.isPresenting) ui.classList.remove('hidden'); });
const keys = {};
addEventListener('keydown', e => { keys[e.code] = true;
  if (e.code === 'Equal' || e.code === 'NumpadAdd') renderer.toneMappingExposure *= 1.1;
  if (e.code === 'Minus' || e.code === 'NumpadSubtract') renderer.toneMappingExposure /= 1.1;
});
addEventListener('keyup', e => { keys[e.code] = false; });

// VR: left stick walk, right stick forward = teleport arc, sideways = smooth turn
const WATCH = new URLSearchParams(location.search).get('watch');   // ?watch=CODE: this PC shows the headset's view
if (!WATCH) document.body.appendChild(VRButton.createButton(renderer, { optionalFeatures: ['local-floor'] }));
renderer.xr.addEventListener('sessionstart', () => { ui.classList.add('hidden'); camera.position.set(0, 0, 0); mirrorMode(true); });
renderer.xr.addEventListener('sessionend', () => { camera.position.set(0, EYE, 0); ui.classList.remove('hidden'); mirrorMode(false); });
const ctrls = [0, 1].map(i => { const c = renderer.xr.getController(i); rig.add(c); return c; });
const marker = new THREE.Mesh(new THREE.RingGeometry(0.18, 0.24, 32).rotateX(-Math.PI / 2),
  new THREE.MeshBasicMaterial({ color: 0xd9b48f, toneMapped: false }));
marker.visible = false; scene.add(marker);
const arcGeo = new THREE.BufferGeometry().setFromPoints(new Array(30).fill(0).map(() => new THREE.Vector3()));
const arc = new THREE.Line(arcGeo, new THREE.LineBasicMaterial({ color: 0xd9b48f, toneMapped: false }));
arc.frustumCulled = false; arc.visible = false; scene.add(arc);
let turnRate = 0, aiming = false, target = null;
const TURN_SPEED = THREE.MathUtils.degToRad(100);   // rad/s at full stick
const exitHold = {};

function teleportArc(c) {
  const o = new THREE.Vector3(), q = new THREE.Quaternion();
  c.getWorldPosition(o); c.getWorldQuaternion(q);
  const v = new THREE.Vector3(0, 0, -1).applyQuaternion(q).multiplyScalar(7);
  const pts = arcGeo.attributes.position; let hit = null, prev = o.clone();
  for (let i = 0; i < 30; i++) {
    const t = i * 0.05, p = o.clone().addScaledVector(v, t); p.y -= 4.9 * t * t;
    if (!hit && i) {
      const d = p.clone().sub(prev); ray.set(prev, d.clone().normalize()); ray.far = d.length();
      const h = ray.intersectObjects(colliders, false)[0];
      if (h) { hit = h; }
    }
    pts.setXYZ(i, ...(hit ? hit.point : p).toArray()); prev = p;
  }
  pts.needsUpdate = true;
  return hit && hit.face && hit.face.normal.clone().transformDirection(hit.object.matrixWorld).y > 0.8 ? hit.point : null;
}

function xrInput(dt) {
  const session = renderer.xr.getSession(); if (!session) return;
  for (const src of session.inputSources) {
    const gp = src.gamepad; if (!gp) continue;
    // B (right) or Y (left) held for half a second: leave VR
    if (gp.buttons[5] && gp.buttons[5].pressed) {
      exitHold[src.handedness] = (exitHold[src.handedness] || 0) + dt;
      if (exitHold[src.handedness] > 0.5) { exitHold.left = exitHold.right = 0; session.end(); return; }
    } else exitHold[src.handedness] = 0;
    if (gp.axes.length < 4) continue;
    const x = gp.axes[2], y = gp.axes[3];
    if (src.handedness === 'left') {
      if (Math.hypot(x, y) > 0.2) {
        const dir = new THREE.Vector3(); camera.getWorldDirection(dir); dir.y = 0; dir.normalize();
        const right = new THREE.Vector3().crossVectors(dir, new THREE.Vector3(0, 1, 0));
        tryMove(dir.multiplyScalar(-y * 1.4 * dt).addScaledVector(right, x * 1.4 * dt));
      }
    } else if (src.handedness === 'right') {
      const c = ctrls[[...session.inputSources].indexOf(src)] || ctrls[1];
      if (y < -0.6) {
        aiming = true; arc.visible = true; target = teleportArc(c);
        marker.visible = !!target; if (target) marker.position.copy(target).y += 0.01;
      } else if (aiming && Math.abs(y) < 0.3) {
        if (target) {
          const head = new THREE.Vector3(); camera.getWorldPosition(head);
          rig.position.x += target.x - head.x; rig.position.z += target.z - head.z;
        }
        aiming = false; arc.visible = marker.visible = false; target = null;
      }
      // smooth turn: speed follows how far the stick is pushed (dead zone, soft curve, eased start and stop)
      const ax = Math.abs(x), want = aiming || ax < 0.15 ? 0 : -Math.sign(x) * Math.pow((ax - 0.15) / 0.85, 1.6) * TURN_SPEED;
      turnRate += (want - turnRate) * Math.min(1, dt * 10);
      if (Math.abs(turnRate) > 1e-4) {
        const head = new THREE.Vector3(); camera.getWorldPosition(head);
        const ang = turnRate * dt;
        rig.position.sub(head).applyAxisAngle(new THREE.Vector3(0, 1, 0), ang).add(head);
        rig.rotation.y += ang;
      }
    }
  }
}

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (WATCH) watchStep(dt);
  else if (renderer.xr.isPresenting) xrInput(dt);
  else if (controls.isLocked) {
    const f = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0);
    const s = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
    if (f || s) {
      const dir = new THREE.Vector3(); camera.getWorldDirection(dir); dir.y = 0; dir.normalize();
      const right = new THREE.Vector3().crossVectors(dir, new THREE.Vector3(0, 1, 0));
      const speed = (keys.ShiftLeft || keys.ShiftRight ? 2.6 : 1.4) * dt;
      tryMove(dir.multiplyScalar(f).add(right.multiplyScalar(s)).normalize().multiplyScalar(speed));
    }
  }
  renderer.render(scene, camera);
  if (!WATCH) castPose();               // after render: in VR the renderer has just put the head pose into camera.matrixWorld
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
// ---------- spectator: the PC shows what the headset sees ----------
// Only the head pose travels (WebRTC data channel via PeerJS, ~30 Hz); the PC renders the same scene itself.
// Headset: registers as archviz-bedroom-<code> and shows the watch link on its start page.
// PC: ?watch=<code> connects, follows the pose smoothly, reconnects when the headset reloads.
const PEER_PREFIX = 'archviz-bedroom-';
const loadPeer = () => import('https://cdn.jsdelivr.net/npm/peerjs@1.5.4/+esm').then(m => m.Peer || m.default);
const castEl = document.getElementById('cast'), badge = document.getElementById('badge');
const viewers = new Set(); let lastSend = 0;
const cP = new THREE.Vector3(), cQ = new THREE.Quaternion(), cS = new THREE.Vector3();
function castPose() {
  if (!viewers.size) return;
  const t = performance.now(); if (t - lastSend < 33) return; lastSend = t;
  camera.matrixWorld.decompose(cP, cQ, cS);
  const msg = [cP.x, cP.y, cP.z, cQ.x, cQ.y, cQ.z, cQ.w].map(v => Math.round(v * 1e4) / 1e4);
  for (const c of viewers) if (c.open) try { c.send(msg); } catch (e) { viewers.delete(c); }
}
function startCast(Peer, tries = 0) {
  let code = localStorage.getItem('archvizCastCode');
  if (!code || tries > 2) { code = String(1000 + Math.floor(Math.random() * 9000)); localStorage.setItem('archvizCastCode', code); }
  const link = location.origin + location.pathname + '?watch=' + code;
  const show = () => castEl.innerHTML = `Смотреть с компьютера: <b>${link}</b><br>код ${code}` +
    (viewers.size ? ` · подключено зрителей: ${viewers.size}` : '');
  const peer = new Peer(PEER_PREFIX + code);
  peer.on('open', show);
  peer.on('connection', c => {
    c.on('open', () => { viewers.add(c); show(); });
    const drop = () => { viewers.delete(c); show(); };
    c.on('close', drop); c.on('error', drop);
  });
  peer.on('disconnected', () => { if (!peer.destroyed) setTimeout(() => !peer.destroyed && peer.reconnect(), 2000); });
  peer.on('error', e => {      // id still held by a previous tab of this headset: retry, then take a new code
    if (e.type === 'peer-unavailable') return;
    peer.destroy(); setTimeout(() => startCast(Peer, e.type === 'unavailable-id' ? tries + 1 : 0), e.type === 'unavailable-id' ? 2500 : 6000);
  });
}

const wP = new THREE.Vector3(), wQ = new THREE.Quaternion();
let gotPose = false, lastPose = 0, watchConn = null;
function watchStep(dt) {
  if (!gotPose) return;
  const a = 1 - Math.exp(-dt * 14);    // smooths the 30 Hz pose stream to the monitor's frame rate
  camera.position.lerp(wP, a); camera.quaternion.slerp(wQ, a);
  const lost = performance.now() - lastPose > 3000;
  badge.textContent = lost ? `Вид из очков · код ${WATCH} · нет сигнала, жду…` : `Вид из очков · код ${WATCH} · F — во весь экран`;
  if (performance.now() - lastPose > 8000 && watchConn) { watchConn.close(); watchConn = null; }
}
function startWatch(Peer) {
  scene.add(camera);                   // off the rig: the pose arrives in world space
  camera.position.set(rig.position.x, EYE, rig.position.z);
  let retryT = 0;
  const peer = new Peer();
  const retry = () => { clearTimeout(retryT); retryT = setTimeout(connect, 3000); };
  function connect() {
    if (peer.disconnected) { peer.reconnect(); return; }
    const c = peer.connect(PEER_PREFIX + WATCH, { serialization: 'json' }); watchConn = c;
    c.on('open', () => { status.textContent = 'Подключено, жду картинку с очков…'; });
    c.on('data', d => {
      if (!Array.isArray(d) || d.length < 7) return;
      wP.set(d[0], d[1], d[2]); wQ.set(d[3], d[4], d[5], d[6]).normalize();
      if (!gotPose) { camera.position.copy(wP); camera.quaternion.copy(wQ); ui.classList.add('hidden'); badge.style.display = 'block'; }
      gotPose = true; lastPose = performance.now();
    });
    c.on('close', () => { if (watchConn === c) watchConn = null; retry(); });
    c.on('error', retry);
  }
  peer.on('open', connect);
  peer.on('disconnected', () => setTimeout(() => !peer.destroyed && peer.reconnect(), 2000));
  peer.on('error', e => {
    if (e.type === 'peer-unavailable' && !gotPose) status.textContent = `Очки с кодом ${WATCH} пока не в сети: откройте сайт в очках. Повторяю…`;
    retry();
  });
  addEventListener('keydown', e => { if (e.code === 'KeyF') document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); });
}

if (WATCH) {
  document.querySelector('#ui h1').textContent = 'Вид из очков';
  document.getElementById('help').style.display = 'none';
  status.textContent = `Подключаюсь к очкам (код ${WATCH})…`;
  loadPeer().then(startWatch).catch(() => status.textContent = 'Не удалось загрузить модуль трансляции (PeerJS). Проверьте интернет.');
} else {
  status.textContent = 'Готово'; go.style.display = 'block';
  loadPeer().then(p => startCast(p)).catch(() => {});
}
window.__dbg.viewers = viewers;
</script>
</body>
</html>
